<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影站【本地后台】</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e8e8e8;
            padding:24px;
            max-width:1200px;
            margin: 0 auto;
        }
        .hidden {display:none !important;}
        h2,h3{margin-bottom:16px;color:#fff;}
        .box{border:1px solid #333;padding:20px;border-radius:10px;margin-bottom:20px;}
        .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0;}
        label{display:block;margin:6px 0 4px;}
        input,select{
            padding:9px 12px;
            background:#222;
            border:1px solid #444;
            color:#fff;
            border-radius:6px;
            font-size:14px;
        }
        input{flex:1;min-width:220px}
        button{
            padding:9px 14px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:14px;
        }
        .btn-blue{background:#2563eb;color:#fff}
        .btn-red{background:#b91c1c;color:#fff}
        .btn-gray{background:#444;color:#fff}
        .item-card{
            border:1px solid #333;
            padding:12px;
            border-radius:8px;
            margin:10px 0;
            display:flex;
            gap:14px;
            align-items:center;
        }
        .item-card img{
            width:120px;height:auto;border-radius:4px;
        }
        .item-info{flex:1;}
        pre{
            background:#000;
            color:#7cf07c;
            padding:12px;
            border-radius:6px;
            max-height:280px;
            overflow:auto;
            font-size:12px;
        }
        .tip{color:#aaa;font-size:13px;margin:6px 0}
    </style>
</head>
<body>

<!--登录面板-->
<div id="loginBox" class="box">
    <h2>本地图库管理后台</h2>
    <label>设置/输入管理密码</label>
    <input type="password" id="localPwd" placeholder="输入密码进入本地后台">
    <button class="btn-blue" onclick="localLogin()">登录本地管理</button>
    <div class="tip">⚠仅本地浏览器生效，不会上传网络</div>
</div>

<!--主管理面板-->
<div id="mainPanel" class="hidden">
    <div class="box">
        <h3>➕新增 / 修改作品</h3>
        <div class="row">
            <div style="flex:1">
                <label>图片路径（assets/xxx.jpg）</label>
                <input type="text" id="imgPath" placeholder="assets/4C7A8106.jpg">
            </div>
            <div style="flex:1">
                <label>作品标题</label>
                <input type="text" id="imgTitle" placeholder="作品名称">
            </div>
            <div>
                <label>分类 data‑cat</label>
                <select id="imgCat">
                    <option value="landscape">landscape｜风光</option>
                    <option value="Architectural">Architectural｜空间</option>
                    <option value="ecology">ecology｜生态</option>
                    <option value="portrait">portrait｜人像</option>
                </select>
            </div>
        </div>
        <div class="row">
            <img id="previewImg" style="max-height:180px;" alt="预览">
        </div>
        <div class="row">
            <button class="btn-blue" onclick="previewSingle()">预览图片</button>
            <button class="btn-blue" onclick="addWork()">添加新作品</button>
            <button class="btn-gray" onclick="clearForm()">清空表单</button>
        </div>
    </div>

    <div class="box">
        <h3>📋全部作品列表（可删除）</h3>
        <div id="workList"></div>
        <div class="tip">点击卡片删除按钮移除作品；数据保存在浏览器本地存储</div>
    </div>

    <div class="box">
        <h3>📤导出（用于你的摄影网站）</h3>
        <div class="row">
            <button class="btn-blue" onclick="exportFigureHtml()">导出 Figure HTML片段</button>
            <button class="btn-blue" onclick="exportWorksJson()">导出 works.json 文件</button>
            <button class="btn-gray" onclick="importJsonTrigger()">导入 works.json</button>
        </div>
        <pre id="exportResult"></pre>
        <div class="tip">
            • Figure HTML →复制粘贴到 index.html 的 imagePool 标签内<br>
            • works.json →适合动态渲染版本的网站读取<br>
            • 导出json做好备份，换浏览器/电脑请导入备份
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none">
    </div>

    <div class="box">
        <button class="btn-red" onclick="localLogout()">退出登录</button>
    </div>
</div>

<script>
//你的本地密码
const LOCAL_PASSWORD = "hello@Mrzhang.com";
let workData = [];

//登录
function localLogin(){
    const inputPwd = document.getElementById('localPwd').value;
    if(inputPwd !== LOCAL_PASSWORD){
        alert("密码错误");
        return;
    }
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("mainPanel").classList.remove("hidden");
    loadFromLocalStorage();
    renderWorkList();
}
function localLogout(){
    document.getElementById("mainPanel").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

//本地存储读写
function loadFromLocalStorage(){
    const raw = localStorage.getItem("photo_workdata");
    if(raw){
        workData = JSON.parse(raw);
    }else{
        workData = [];
    }
}
function saveToLocalStorage(){
    localStorage.setItem("photo_workdata", JSON.stringify(workData));
}

//表单操作
function previewSingle(){
    const path = document.getElementById('imgPath').value.trim();
    document.getElementById('previewImg').src = path;
}
function clearForm(){
    document.getElementById('imgPath').value = "";
    document.getElementById('imgTitle').value = "";
    document.getElementById('previewImg').src = "";
}

//新增作品
function addWork(){
    const src = document.getElementById('imgPath').value.trim();
    const title = document.getElementById('imgTitle').value.trim();
    const cat = document.getElementById('imgCat').value;
    if(!src || !title){
        alert("图片路径、标题不能为空");
        return;
    }
    workData.push({src,title,cat});
    saveToLocalStorage();
    renderWorkList();
    clearForm();
    alert("✅作品添加成功");
}

//渲染作品列表
function renderWorkList(){
    const container = document.getElementById("workList");
    container.innerHTML = "";
    if(workData.length ===0){
        container.innerHTML = "<div class='tip'>暂无作品，请添加</div>";
        return;
    }
    workData.forEach((item,index)=>{
        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
            <img src="${item.src}" alt="${item.title}">
            <div class="item-info">
                <div>标题：${item.title}</div>
                <div>分类：${item.cat}</div>
                <div>路径：${item.src}</div>
            </div>
            <button class="btn-red" onclick="deleteItem(${index})">删除</button>
        `;
        container.appendChild(div);
    })
}

//删除
function deleteItem(idx){
    if(!confirm("确认删除这条作品？"))return;
    workData.splice(idx,1);
    saveToLocalStorage();
    renderWorkList();
}

//导出Figure HTML（适配你原网站imagePool格式）
function exportFigureHtml(){
    let out = "";
    workData.forEach(item=>{
        out += `<figure class="work-item" data-cat="${item.cat}" data-src="${item.src}" data-title="${item.title}">
  <div class="frame">
    <img src="${item.src}" alt="${item.title}" loading="lazy">
    <div class="item-caption">${item.title}</div>
  </div>
</figure>
`;
    })
    document.getElementById("exportResult").innerText = out;
}

//导出json文件下载
function exportWorksJson(){
    const jsonStr = JSON.stringify({list:workData},null,2);
    const blob = new Blob([jsonStr],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "works.json";
    a.click();
    URL.revokeObjectURL(url);
    document.getElementById("exportResult").innerText = jsonStr;
}

//导入json备份
function importJsonTrigger(){
    document.getElementById("importFileInput").click();
}
document.getElementById("importFileInput").onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = function(ev){
        try{
            const obj = JSON.parse(ev.target.result);
            if(obj.list && Array.isArray(obj.list)){
                workData = obj.list;
                saveToLocalStorage();
                renderWorkList();
                alert("✅导入成功");
            }else{
                alert("JSON格式不对");
            }
        }catch(err){
            alert("文件解析失败");
        }
    }
    reader.readAsText(f);
}
</script>
</body>
</html>
